<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text & URL to Barcode / QR Code Generator</title>
  <meta name="description" content="Generate high-quality 1D barcodes and 2D QR codes dynamically from URLs, text, Wi-Fi networks, emails, or SMS. Export as SVG or PNG.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-qr-code"><rect width="5" height="5" x="2" y="2" rx="1"/><rect width="5" height="5" x="17" y="2" rx="1"/><rect width="5" height="5" x="2" y="17" rx="1"/><path d="M2 9h10"/><path d="M12 2v10"/><path d="M12 12h2"/><path d="M20 12h2"/><path d="M20 20h2"/><path d="M17 17h2"/><path d="M12 17v5"/><path d="M22 17v3"/><path d="M17 22h5"/><path d="M17 12v3"/><path d="M12 20h5"/><path d="M17 2v3"/><path d="M22 6v1"/><path d="M15 15h1"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/></svg>
        <span>Barcode & QR Studio</span>
      </div>
      <a href="https://github.com/ibrezm1/text2barcode" target="_blank" rel="noopener noreferrer" class="github-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <main>
    <!-- Left Column: Settings and Input -->
    <section class="card">
      <h2 class="panel-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        <span>Configure Generator</span>
      </h2>

      <!-- Mode Switcher -->
      <div class="mode-tabs">
        <button id="tab-qr" class="mode-tab active" onclick="switchMode('qr')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-qr-code"><rect width="5" height="5" x="2" y="2" rx="1"/><rect width="5" height="5" x="17" y="2" rx="1"/><rect width="5" height="5" x="2" y="17" rx="1"/><path d="M2 9h10"/><path d="M12 2v10"/><path d="M12 12h2"/><path d="M20 12h2"/><path d="M20 20h2"/><path d="M17 17h2"/><path d="M12 17v5"/><path d="M22 17v3"/><path d="M17 22h5"/><path d="M17 12v3"/><path d="M12 20h5"/><path d="M17 2v3"/><path d="M22 6v1"/><path d="M15 15h1"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/></svg>
          2D QR Code
        </button>
        <button id="tab-barcode" class="mode-tab" onclick="switchMode('barcode')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-barcode"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>
          1D Barcode
        </button>
      </div>

      <!-- Quick Templates -->
      <div class="template-selector" id="templates-container">
        <button class="template-btn active" data-type="text">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          Plain Text
        </button>
        <button class="template-btn" data-type="url">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link-2"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
          URL
        </button>
        <button class="template-btn" data-type="wifi" id="template-wifi">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wifi"><path d="M12 20h.01"/><path d="M8.5 16.5c3.5-3.5 8.5-3.5 12 0"/><path d="M5 13a15 15 0 0 1 20 0"/><path d="M1.5 9.5c6.9-6.9 18.1-6.9 25 0"/></svg>
          Wi-Fi Network
        </button>
        <button class="template-btn" data-type="email" id="template-email">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          Email
        </button>
        <button class="template-btn" data-type="sms" id="template-sms">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          SMS
        </button>
      </div>

      <!-- Main Input Field -->
      <div class="form-group" id="main-input-group">
        <label id="input-label" for="content-input">Text or URL to Encode</label>
        <div class="input-container">
          <textarea id="content-input" placeholder="Type or paste your text/URL here..." autocomplete="off"></textarea>
        </div>
      </div>

      <!-- Wi-Fi Form Overlay -->
      <div id="form-wifi" class="sub-form">
        <div class="form-group">
          <label for="wifi-ssid">Network Name (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="e.g. Home_Network">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="wifi-password">Password</label>
            <input type="password" id="wifi-password" placeholder="Leave empty if open">
          </div>
          <div class="form-group">
            <label for="wifi-encryption">Security Type</label>
            <select id="wifi-encryption">
              <option value="WPA">WPA / WPA2</option>
              <option value="WEP">WEP</option>
              <option value="nopass">None (Open)</option>
            </select>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.25rem;">
          <input type="checkbox" id="wifi-hidden" style="width:auto; margin:0;">
          <label for="wifi-hidden" style="margin:0; font-size:0.85rem; cursor:pointer;">Hidden Network</label>
        </div>
      </div>

      <!-- Email Form Overlay -->
      <div id="form-email" class="sub-form">
        <div class="form-group">
          <label for="email-to">To (Recipient Email)</label>
          <input type="text" id="email-to" placeholder="e.g. contact@example.com">
        </div>
        <div class="form-group">
          <label for="email-subject">Subject</label>
          <input type="text" id="email-subject" placeholder="e.g. Inquiry">
        </div>
        <div class="form-group">
          <label for="email-body">Body Message</label>
          <textarea id="email-body" style="min-height:70px;" placeholder="Message body text..."></textarea>
        </div>
      </div>

      <!-- SMS Form Overlay -->
      <div id="form-sms" class="sub-form">
        <div class="form-group">
          <label for="sms-phone">Phone Number</label>
          <input type="text" id="sms-phone" placeholder="e.g. +15550199">
        </div>
        <div class="form-group">
          <label for="sms-message">Message</label>
          <textarea id="sms-message" style="min-height:70px;" placeholder="Type SMS text here..."></textarea>
        </div>
      </div>

      <!-- Customization Section -->
      <div class="customization-section">
        <button class="accordion-toggle" onclick="toggleAccordion()">
          <span>Style & Options</span>
          <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="accordion-options" class="accordion-content">
          <div class="customization-grid">
            <div class="form-group">
              <label>Foreground Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="color-fg" value="#000000">
                <span id="color-fg-hex">#000000</span>
              </div>
            </div>
            <div class="form-group">
              <label>Background Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="color-bg" value="#ffffff">
                <span id="color-bg-hex">#ffffff</span>
              </div>
            </div>
            <div class="form-group" id="opt-size-group">
              <label id="lbl-size" for="opt-size">QR Code Size (px)</label>
              <select id="opt-size">
                <option value="128">Small (128x128)</option>
                <option value="256" selected>Medium (256x256)</option>
                <option value="512">Large (512x512)</option>
                <option value="1024">Ultra (1024x1024)</option>
              </select>
            </div>
            <div class="form-group" id="opt-barcode-format-group" style="display:none;">
              <label for="opt-barcode-format">Format</label>
              <select id="opt-barcode-format">
                <option value="CODE128" selected>Code 128 (General text/ASCII)</option>
                <option value="EAN13">EAN-13 (12 numbers)</option>
                <option value="UPC">UPC (11-12 numbers)</option>
                <option value="CODE39">Code 39 (Alphanumeric/Capital letters)</option>
                <option value="ITF14">ITF-14 (14 numbers)</option>
                <option value="Codabar">Codabar (Numbers and A,B,C,D)</option>
              </select>
            </div>
            <div class="form-group" id="opt-qr-error-group">
              <label for="opt-qr-error">Error Correction</label>
              <select id="opt-qr-error">
                <option value="L">L (Low - 7% recovery)</option>
                <option value="M" selected>M (Medium - 15% recovery)</option>
                <option value="Q">Q (Quartile - 25% recovery)</option>
                <option value="H">H (High - 30% recovery)</option>
              </select>
            </div>
            <div class="form-group" id="opt-barcode-text-group" style="display:none; align-items:center; justify-content:center; flex-direction:row; gap:0.5rem; height:50px;">
              <input type="checkbox" id="opt-barcode-text" checked style="width:auto; margin:0;">
              <label for="opt-barcode-text" style="margin:0; cursor:pointer;">Display Text Below</label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column: Live Preview & Actions -->
    <section class="card preview-card">
      <h2 class="panel-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 20.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-20.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Live Preview</span>
      </h2>

      <!-- Display box for codes -->
      <div id="code-container" class="preview-container">
        <!-- Placeholder when empty -->
        <div id="preview-placeholder" class="preview-placeholder">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
          <p>Your code will appear here</p>
          <span style="font-size:0.75rem; color:var(--text-muted);">Enter text on the left to generate</span>
        </div>
        
        <!-- QR Code container -->
        <div id="qrcode"></div>
        
        <!-- Barcode container (SVG target) -->
        <svg id="barcode"></svg>
      </div>

      <!-- Live character counter or status info -->
      <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:1rem; text-align:center; min-height:1.2rem;" id="code-info"></div>

      <!-- Action items -->
      <div class="action-buttons">
        <button id="btn-generate" class="btn btn-primary" onclick="generateCodeManual()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          Force Regenerate
        </button>
        <button id="btn-copy" class="btn btn-secondary" onclick="copyContent()" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy Value
        </button>
        <button id="btn-print" class="btn btn-secondary" onclick="printCode()" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
          Print Code
        </button>
        <button id="btn-download-png" class="btn btn-secondary" onclick="downloadPNG()" disabled style="grid-column: span 2; background: rgba(6, 182, 212, 0.08); border-color: rgba(6, 182, 212, 0.2);">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Download Image (PNG)
        </button>
      </div>

      <!-- History Pane -->
      <div class="history-section" style="width: 100%;">
        <div class="history-header">
          <span class="history-title">Recent History</span>
          <button id="btn-clear-history" class="clear-btn" onclick="clearHistory()">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            Clear History
          </button>
        </div>
        
        <div id="history-list" class="history-list">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Container -->
  <div id="toast-message" class="toast">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-circle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span id="toast-text">Value copied!</span>
  </div>

  <footer>
    <p>Made with &hearts; for developers. Run client-side. No tracking. <a href="https://github.com/ibrezm1/text2barcode" target="_blank" rel="noopener noreferrer">Source Code</a></p>
  </footer>

  <!-- Include Barcode and QR Libraries -->
  <!-- 1D Barcode Library JSBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- 2D QR Code Library QRCodeJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="app.js"></script>
</body>
</html>
